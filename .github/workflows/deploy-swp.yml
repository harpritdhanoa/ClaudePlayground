name: Deploy SWP Planner to GitHub Pages

on:
  push:
    branches: [main, "claude/swp-planner-app-9moQe"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/swp-planner-app-9moQe

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: swp-planner/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: swp-planner

      - name: Build
        run: npm run build
        working-directory: swp-planner
        env:
          VITE_BASE: /ClaudePlayground/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: swp-planner/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
